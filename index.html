<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIKKE材料记录工具</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button type="button" id="theme-toggle-btn" class="theme-toggle-btn">
            <span class="theme-toggle-icon" id="theme-icon">🌙</span>
            <span class="theme-toggle-text" id="theme-text">深色模式</span>
        </button>
    </div>
    
    <div class="container">
        <header>
            <h1>NIKKE游戏材料记录工具</h1>
            <p>定制模组及定制模组零件记录与统计</p>
        </header>

        <main>
            <section class="input-section">
                <h2>数据录入</h2>
                <form id="material-form">
                    <div class="form-group">
                        <label for="record-date">日期</label>
                        <div class="date-input-group">
                            <button type="button" id="prev-day" class="date-nav-btn">&lt;</button>
                            <input type="date" id="record-date" required>
                            <button type="button" id="next-day" class="date-nav-btn">&gt;</button>
                        </div>
                    </div>
                    
                    <div class="acquisition-group">
                        <h3>第一次获取</h3>
                        <div class="form-group">
                            <label for="modules-1">定制模组数量</label>
                            <input type="number" id="modules-1" min="0" value="0" required>
                        </div>
                    </div>
                    
                    <div class="acquisition-group">
                        <h3>第二次获取</h3>
                        <div class="form-group">
                            <label for="modules-2">定制模组数量</label>
                            <input type="number" id="modules-2" min="0" value="0" required>
                        </div>
                    </div>
                    
                    <div class="acquisition-group">
                        <h3>第三次获取</h3>
                        <div class="form-group">
                            <label for="modules-3">定制模组数量</label>
                            <input type="number" id="modules-3" min="0" value="0" required>
                        </div>
                    </div>
                    
                    <div class="parts-group">
                        <h3>定制模组零件</h3>
                        <div class="form-group">
                            <label for="parts-stage">选择阶段</label>
                            <select id="parts-stage">
                                <option value="">请选择阶段</option>
                                <option value="5">5阶段 (81零件)</option>
                                <option value="6">6阶段 (105零件)</option>
                                <option value="7">7阶段 (111零件)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="parts">定制模组零件数量</label>
                            <input type="number" id="parts" min="0" value="0" required>
                        </div>
                    </div>
                    
                    <div class="double-output-group">
                        <label>
                            <input type="checkbox" id="double-parts-check"> 启用双倍产出（仅零件翻倍）
                        </label>
                    </div>
                    
                    <button type="submit" class="submit-btn">提交记录</button>
                </form>
            </section>

            <section class="settings-section">
                <h2>期望产出设置</h2>
                <div class="settings-form">
                    <div class="form-group">
                        <label for="expectation-type">设置类型</label>
                        <select id="expectation-type">
                            <option value="daily">按天</option>
                            <option value="monthly">按月</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="expectation-value">期望产出值</label>
                        <input type="number" id="expectation-value" min="0" step="0.01">
                    </div>
                    <div class="form-group advanced-monthly" style="display: none;">
                        <label>智能月度设置</label>
                        <div class="advanced-monthly-content">
                            <div class="form-row">
                                <div class="form-col">
                                    <label for="double-days">双倍天数/月</label>
                                    <input type="number" id="double-days" min="0" max="31" value="7" step="1">
                                </div>
                                <div class="form-col">
                                    <label for="normal-days">普通天数/月</label>
                                    <input type="number" id="normal-days" min="0" max="31" value="23" step="1">
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-col">
                                    <label for="stage-type">默认阶段</label>
                                    <select id="stage-type">
                                        <option value="6">6阶段 (推荐)</option>
                                        <option value="7">7阶段 (推荐)</option>
                                        <option value="5">5阶段 (使用默认期望值)</option>
                                    </select>
                                </div>
                                <button type="button" id="calculate-monthly" class="calculate-btn">智能计算月期望</button>
                            </div>
                        </div>
                    </div>
                    <button id="save-expectation" class="save-btn">保存设置</button>
                </div>
            </section>

            <section class="stats-section">
                <h2>数据统计</h2>
                <div class="stats-controls">
                    <button id="daily-stats" class="stats-btn active">按天统计</button>
                    <button id="monthly-stats" class="stats-btn">按月统计</button>
                </div>
                <div class="stats-content">
                    <div class="stats-item">
                        <span class="stats-label">实际产出总量（定制模组）：</span>
                        <span id="actual-total" class="stats-value">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">期望产出总量：</span>
                        <span id="expected-total" class="stats-value">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">差值：</span>
                        <span id="difference-total" class="stats-value">0</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">总产出量（含零件换算）：</span>
                        <span id="production-total" class="stats-value">0</span>
                    </div>
                    <div class="stats-item real-time-calc enhanced">
                        <span class="stats-label">实时预览 - 总产出量：</span>
                        <span id="realtime-production" class="stats-value">0</span>
                    </div>
                    <div class="stats-item real-time-calc enhanced">
                        <span class="stats-label">实时预览 - 与期望差值：</span>
                        <span id="realtime-difference" class="stats-value">0</span>
                    </div>
                </div>
                
                <!-- 月度统计详细信息 -->
                <div id="monthly-stats-detail" class="monthly-stats-detail" style="display: none;">
                    <h3>月度详细统计</h3>
                    <div id="monthly-stats-container" class="monthly-stats-container"></div>
                </div>
            </section>

            <section class="history-section">
                <h2>历史记录</h2>
                <div class="history-controls">
                    <button id="sort-date" class="sort-btn active">按日期排序</button>
                    <button id="sort-difference" class="sort-btn">按差值排序</button>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>第一次</th>
                                <th>第二次</th>
                                <th>第三次</th>
                                <th>零件</th>
                                <th>模组总数</th>
                                <th>零件换算</th>
                                <th>总产出</th>
                                <th>差值</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="history-table"></tbody>
                    </table>
                    <div id="no-records" style="text-align:center;padding:20px;display:none">暂无记录</div>
                </div>
            </section>
        </main>
        
        <footer class="footer">
            <div class="import-export-controls">
                <button id="export-data" class="action-btn export-btn">导出 JSON</button>
                <button id="export-csv-data" class="action-btn csv-btn">导出 CSV</button>
                <button id="import-data" class="action-btn import-btn">导入数据</button>
                <input type="file" id="file-input" accept=".json" style="display: none;">
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
